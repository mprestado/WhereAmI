[package]
name = "whereami"
version = "0.5.0"
description = "A personal workspace for goals and task lists"
license = "MIT"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
